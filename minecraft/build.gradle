plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"osl" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		// dev client: a fixed window size so the camera/projection maths is easy to check; commands allowed for tests
		client {
			programArgs "--width", "1280", "--height", "720", "--username", "Courier"
			vmArgs "--enable-native-access=ALL-UNNAMED", "-Dosl.allowCommands=true", "-Dosl.devNoSrgb=" + (System.getenv("OSL_DEV_NO_SRGB") ?: "false")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// WebSocket server the New Vegas plugin connects to
	implementation "org.java-websocket:Java-WebSocket:1.6.0"
	include "org.java-websocket:Java-WebSocket:1.6.0"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "passed", "failed"; exceptionFormat "full" }
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
